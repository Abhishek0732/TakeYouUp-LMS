server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Docker's embedded DNS — lets nginx re-resolve the backend container IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---- API reverse proxy -------------------------------------------------
    # The frontend calls the API with RELATIVE paths (/api/...), so the app
    # works on whatever host/URL the frontend itself is served from. nginx
    # forwards those calls to the backend over the internal docker network.
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Uploaded / generated static assets (course covers, etc.) ----------
    location /uploads/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Actuator health (handy for probes hitting the web origin) ---------
    location /actuator/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # ---- SPA -------------------------------------------------------------
    # Every unknown route serves index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_proxied any;   # compress responses proxied from the backend (JSON API) too
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
