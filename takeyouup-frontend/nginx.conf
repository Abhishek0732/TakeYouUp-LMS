server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Docker's embedded DNS — lets nginx re-resolve the backend container IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---- API reverse proxy -------------------------------------------------
    # The frontend calls the API with RELATIVE paths (/api/...), so the app
    # works on whatever host/URL the frontend itself is served from. nginx
    # forwards those calls to the backend over the internal docker network.
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Uploaded / generated static assets (course covers, etc.) ----------
    # ^~ is required: these are .jpg/.png paths, and the static-file regex
    # location further down would otherwise take precedence and try to serve
    # them from nginx's own root, 404ing every course cover.
    location ^~ /uploads/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Actuator health (handy for probes hitting the web origin) ---------
    location /actuator/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # ---- robots.txt -------------------------------------------------------
    # Generated here rather than shipped as a static file for one reason: the
    # Sitemap directive must be an ABSOLUTE URL (a relative path is not part of
    # the spec and Google ignores it), and the domain is not known at build
    # time. nginx knows $host per request, so this stays correct on localhost, a
    # tunnel, or the real domain without anyone editing a file.
    # Served by nginx, not the backend, so a backend outage cannot turn this
    # into a 5xx — crawlers read a 5xx robots.txt as "stop crawling entirely".
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\n\n# Signed-in areas hold no public content and only waste crawl budget.\n# These pages also send <meta name=\"robots\" content=\"noindex\">, which is what\n# keeps them out of the index; Disallow only stops the crawl.\nDisallow: /admin\nDisallow: /profile\nDisallow: /certificates\nDisallow: /login\nDisallow: /signup\nDisallow: /verify-email\nDisallow: /reset-password\nDisallow: /forgot-password\n\n# One page per certificate serial, no search value.\nDisallow: /verify/\n\nSitemap: $scheme://$http_host/sitemap.xml\n";
    }

    # ---- Sitemap ----------------------------------------------------------
    # Generated from the database by the backend so it never goes stale. Without
    # this it fell through the SPA rewrite below and returned the HTML app with
    # a 200 and Content-Type: text/html.
    location = /sitemap.xml {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Missing static files must 404, not return the app -----------------
    # The SPA rewrite below is right for app routes but wrong for assets: a
    # mistyped .xml/.json/.txt/image path was answering 200 with index.html,
    # which reads to a crawler as "this file exists and is a web page".
    location ~* \.(xml|json|txt|png|jpe?g|gif|svg|ico|webp|css|js|map|woff2?)$ {
        try_files $uri =404;
        expires 1h;
    }

    # ---- SPA -------------------------------------------------------------
    # Every unknown route serves index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ^~ so this wins over the regex location above — Vite's /assets/ filenames
    # are content-hashed and must keep the 1-year immutable policy, not the
    # 1-hour default that regex block applies to loose static files.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_proxied any;   # compress responses proxied from the backend (JSON API) too
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
