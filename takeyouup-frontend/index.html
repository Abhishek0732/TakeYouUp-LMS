<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TakeYouUp — Learn DSA, Java, Python & System Design</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts. Declared here rather than via @import in index.css so the
         connection opens in parallel with the stylesheet instead of after it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
    />
    <meta
      name="description"
      content="Free structured courses in Data Structures & Algorithms, Java, Python, Web Development, Machine Learning and System Design — with lesson-by-lesson progress tracking, quizzes, curated practice problems and aptitude prep."
    />
    <meta name="author" content="TakeYouUp" />
    <meta name="theme-color" content="#ff4d1c" />

    <!-- Open Graph. Make og:image an absolute URL on your own domain once you
         have one; crawlers do not resolve relative paths. -->
    <meta property="og:site_name" content="TakeYouUp" />
    <meta property="og:title" content="TakeYouUp — Learn DSA, Java, Python & System Design" />
    <meta
      property="og:description"
      content="Structured programming courses with progress tracking, quizzes and curated practice problems. Free to start."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TakeYouUp — master programming and build your future" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TakeYouUp — Learn DSA, Java, Python & System Design" />
    <meta
      name="twitter:description"
      content="Structured programming courses with progress tracking, quizzes and curated practice problems. Free to start."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Structured data: search engines can present this as an education
         provider rather than a generic page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "TakeYouUp",
        "description": "Structured programming courses in DSA, Java, Python, Web Development, Machine Learning and System Design, with progress tracking, quizzes and curated practice problems.",
        "sameAs": []
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
