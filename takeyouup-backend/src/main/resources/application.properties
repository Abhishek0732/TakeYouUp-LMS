spring.application.name=takeyouup

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
app.base-url=${APP_BASE_URL:http://localhost:8082}
# Fallback origin for emailed links when the request carries no Origin/Referer
# (curl, server-to-server). Browser traffic uses the real origin instead.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5174}

# ---------------------------------------------------------------------------
# Datasource (env-driven; defaults target a local MySQL for non-docker dev)
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/takeyouup?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# Flyway owns the schema, so Hibernate only validates it by default.
# During the initial schema-bootstrap run we override JPA_DDL_AUTO=update and
# SPRING_FLYWAY_ENABLED=false via environment variables.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# The controllers serialize lazy JPA associations during response rendering,
# so open-session-in-view must stay enabled (this is also the Spring Boot default).
spring.jpa.open-in-view=true
spring.threads.virtual.enabled=false

# ---------------------------------------------------------------------------
# Performance
# default_batch_fetch_size turns N+1 lazy loads (course -> modules -> lessons
# -> keyPoints, resource graphs, etc.) into a handful of batched IN queries,
# so response time stays flat as the data grows.
# ---------------------------------------------------------------------------
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=20000

# Gzip API responses (nginx also compresses proxied JSON)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ---------------------------------------------------------------------------
# Flyway (schema migrations + seed data)
# ---------------------------------------------------------------------------
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Actuator (used for the Docker health check)
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# The SMTP server is optional and not reachable in most environments, so its
# health indicator must not drag the overall status to DOWN.
management.health.mail.enabled=false

# ---------------------------------------------------------------------------
# Mail
# ---------------------------------------------------------------------------
# Defaults point at the bundled Mailpit test inbox. Set MAIL_USERNAME (and
# MAIL_HOST/MAIL_PORT) and MailConfig switches to authenticated SMTP + STARTTLS.
spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:no-reply@takeyouup.local}

# ---------------------------------------------------------------------------
# Static uploads
# ---------------------------------------------------------------------------
spring.web.resources.static-locations=file:${FILE_UPLOAD_DIR:uploads}/
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
# Cover images are capped at 5 MB by FileStorageService; keep the container
# limits just above that so oversized uploads fail with a clean 400.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:6MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:8MB}

# ---------------------------------------------------------------------------
# JWT — short-lived access token + long-lived refresh token
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:takeyouupsecretkeytakeyouupsecretkeytakeyouupsecretkeytakeyouupsecretkey}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---------------------------------------------------------------------------
# Login throttling
# ---------------------------------------------------------------------------
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}

# ---------------------------------------------------------------------------
# Email verification (enforcement is OFF by default so the demo works without
# a configured SMTP server; set app.auth.require-verified-email=true to enforce)
# ---------------------------------------------------------------------------
app.auth.require-verified-email=${REQUIRE_VERIFIED_EMAIL:false}

# ---------------------------------------------------------------------------
# Spring AI (Google Gemini). A key must be present for the chat client bean to
# build; the committed key is kept as a fallback default so the app still boots.
# ---------------------------------------------------------------------------
spring.ai.google.genai.api-key=${GEMINI_API_KEY:AIzaSyANL8sqF5bCHMB1nTiTTxhwXsmqf_3j910}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3-flash-preview}
